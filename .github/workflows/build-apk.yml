name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Slovnicek.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slovnicek-apk
          path: Slovnicek.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Slovníček 1.0.${{ github.run_number }}
          body: |
            Stiahni **Slovnicek.apk** v telefóne a nainštaluj (povoľ inštaláciu z neznámych zdrojov).
            Nová verzia sa nainštaluje cez starú a postup detí ostane zachovaný.
          files: Slovnicek.apk
          make_latest: true
