plugins {
    id 'com.android.application'
}

// Each CI build gets a higher version number, so a new APK installs over the old one
// and keeps the kids' progress.
def runNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "1"

android {
    namespace 'sk.johnyhost.slovnicek'
    compileSdk 34

    defaultConfig {
        applicationId 'sk.johnyhost.slovnicek'
        minSdk 21
        targetSdk 34
        versionCode runNumber.toInteger()
        versionName "1.0.${runNumber}"
    }

    // Fixed key committed in the repo: every build is signed the same way,
    // so updates install on top of the previous version (progress is kept).
    signingConfigs {
        shared {
            storeFile rootProject.file('keystore/slovnicek.p12')
            storePassword 'slovnicek'
            keyAlias 'slovnicek'
            keyPassword 'slovnicek'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
